services:
  app:
    image: fireflyiii/core:latest
    hostname: app
    container_name: firefly_iii_core
    restart: always
    volumes:
      - firefly_iii_upload:/var/www/html/storage/upload
    env_file: env.env
    networks:
      firefly_iii:
        ipv4_address: 10.0.8.4
    ports:
      - 8093:8080
    depends_on:
      - db
  db:
    image: postgres:17-alpine
    hostname: db
    container_name: firefly_iii_db
    restart: always
    env_file: db.env
    networks:
      firefly_iii:
        ipv4_address: 10.0.8.3
    volumes:
      - type: volume
        source: firefly_iii_db
        target: /var/lib/postgresql/data
  cron:
    #
    # To make this work, set STATIC_CRON_TOKEN in your .env file or as an environment variable and replace REPLACEME below
    # The STATIC_CRON_TOKEN must be *exactly* 32 characters long
    #
    image: alpine
    restart: always
    container_name: firefly_iii_cron
    command: sh -c "echo \"0 3 * * * wget -qO- http://app:8080/api/v1/cron/REPLACEME;echo\" | crontab - && crond -f -L /dev/stdout"
    networks:
      firefly_iii:
        ipv4_address: 10.0.8.2


volumes:
  firefly_iii_upload:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ../data/firefly_iii_data/firefly_iii_upload
  
  firefly_iii_db:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ../data/firefly_iii_data/firefly_iii_db

networks:
  firefly_iii:
      name: 'firefly_iii_network'
      ipam:
          config:
            - subnet: 10.0.8.0/24

