  #     - TZ=America/Argentina/Buenos Aires
  #   volumes:
  #     - ${PLEX_ROOT_STORAGE}${PLEX_STORAGE}:/root/Library/Application Support/Plex Media Server
  #     - ${PLEX_MEDIA}:/media
  #     - ${PLEX_ROOT_STORAGE}/plex/tmp:/tmp
  #   restart: unless-stopped
  #   network_mode: "host"
  # prowlar:
  #   image: ghcr.io/hotio/prowlarr
  #   ports:
  #     - 8091:9696
  #   environment:
  #     PUID: 1000
  #     PGID: 1000
  #     UMASK: 002
  #     TZ: "Etc/UTC"
  #   volumes:
  #     - prowlar_config:/config
  #   networks:
  #     plex_network:
  #       ipv4_address: 10.0.2.5
     # Solo funciona en Linux
  sonarr:
    image: ghcr.io/hotio/sonarr
    ports:
    - 8089:8989
    environment:
      PUID: 1000
      PGID: 1000
      UMASK: 002
      TZ: "Etc/UTC"
    volumes:
      - sonarr_config:/config
      - ${PLEX_ROOT_STORAGE}/sonarr/data:/data
      - ${PLEX_ROOT_STORAGE}/sonnar/downloads:/downloads/complete
    networks:
      plex_network:
        ipv4_address: 10.0.2.2
  radarr:
    image: ghcr.io/hotio/radarr
    ports:
    - 8090:7878
    environment:
      PUID: 1000
      PGID: 1000
      UMASK: 002
      TZ: "Etc/UTC"
    volumes:
      - radarr_config:/config
      - ${PLEX_ROOT_STORAGE}/radarr/data:/data
      - ${PLEX_ROOT_STORAGE}/radarr/downloads:/downloads/complete
    networks:
      plex_network:
        ipv4_address: 10.0.2.4
  bazarr:
    image: lscr.io/linuxserver/bazarr
    ports:
    - 8092:6767
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    restart: unless-stopped
    networks:
      plex_network:
        ipv4_address: 10.0.2.6
  transmission:
    image : jaymoulin/transmission:3.00-1.6.1
    command: transmission-daemon -f -g /config
    volumes:
      - transmission_config:/config
      - ${PLEX_ROOT_STORAGE}/transmission/torrents:/downloads
    ports:
    - 9091:9091
    - 51413:51413
    - 51413:51413/udp
    expose:
    - 9091
    restart: unless-stopped
    networks:
      plex_network:
        ipv4_address: 10.0.2.3
volumes:
  sonarr_config:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${PLEX_ROOT_STORAGE}/sonarr/sonarr_config
  radarr_config:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${PLEX_ROOT_STORAGE}/radarr/radarr_config
  transmission_config:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${PLEX_ROOT_STORAGE}/transmission/transmission_config
  prowlar_config:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${PLEX_ROOT_STORAGE}/prowlarr/prowlarr_config
  radarr_config:
networks:
  plex_network:
    name: 'plex_network'
    ipam:
        config:
          - subnet: 10.0.2.0/24
